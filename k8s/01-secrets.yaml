# Remplir les valeurs avant d'appliquer.
# Le mot de passe postgres dans DATABASE_URL doit correspondre à POSTGRES_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: vecteurgn-secrets
  namespace: vecteurgn
type: Opaque
stringData:
  DATABASE_URL: "postgresql://vecteur:CHANGE_ME@postgres:5432/vecteurgn"
  SECRET_KEY: "CHANGE_ME_strong_jwt_secret"
  POSTGRES_PASSWORD: "CHANGE_ME"
