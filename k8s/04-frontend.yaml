# Remplacer l'image par la vôtre après: docker build + docker push
# Exemple: docker build -f frontend/Dockerfile --build-arg EXPO_PUBLIC_BACKEND_URL=https://api.ton-domaine.com -t ghcr.io/MON_ORG/vecteurgn-frontend:latest ./frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vecteurgn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_REGISTRY/vecteurgn-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vecteurgn
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
