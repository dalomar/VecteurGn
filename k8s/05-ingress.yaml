# Nécessite nginx-ingress-controller installé sur le cluster.
# Remplacer "ton-domaine.com" par votre domaine réel.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vecteurgn-ingress
  namespace: vecteurgn
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: ton-domaine.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
