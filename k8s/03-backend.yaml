# Remplacer l'image par la vôtre après: docker build + docker push
# Exemple: docker build -f backend/Dockerfile -t ghcr.io/MON_ORG/vecteurgn-backend:latest .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: vecteurgn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: YOUR_REGISTRY/vecteurgn-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vecteurgn-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vecteurgn-secrets
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: vecteurgn
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
