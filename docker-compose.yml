services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vecteurgn
      POSTGRES_USER: vecteur
      POSTGRES_PASSWORD: vecteurgn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vecteur:vecteurgn@db:5432/vecteurgn
      SECRET_KEY: vecteur-gn-secret-key-change-in-production
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
